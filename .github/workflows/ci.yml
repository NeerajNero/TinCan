# The checks that already exist, run on every push and pull request. No new tooling:
# `checks` is what `pnpm typecheck && pnpm lint && pnpm knip && pnpm test` does locally,
# `rules` is `pnpm test:rules` on the Firebase emulators, `e2e` is `pnpm test:e2e`
# (production build + Playwright) on pushes to main or by hand (Actions → CI → Run workflow).
# `deploy-rules` is `pnpm rules:deploy` on pushes to main that touch the rules, after `checks`
# and `rules` pass: it needs the FIREBASE_SERVICE_ACCOUNT and ALLOWED_EMAILS secrets and the
# CLOUDINARY_CLOUD_NAME variable (docs/operations.md → CI). The live rules fell behind the
# templates four times while deploying was a manual step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels the run still going on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders so scripts that read env never need .env.local. Obviously fake: nothing here can reach a real project.
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-fake-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: tincan-ci-fake.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: tincan-ci-fake
  NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://tincan-ci-fake-default-rtdb.firebaseio.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000
  NEXT_PUBLIC_FIREBASE_VAPID_KEY: ci-fake-vapid-key
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: tincan-ci-fake
  NEXT_PUBLIC_CLOUDINARY_PRESET_IMAGE: tincan_image
  NEXT_PUBLIC_CLOUDINARY_PRESET_AUDIO: tincan_audio
  ALLOWED_EMAILS: ci-a@example.com,ci-b@example.com

jobs:
  checks:
    name: typecheck · lint · knip · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json # "engines.node"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test

  rules:
    name: security rules (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: npm install -g firebase-tools
      - run: pnpm test:rules

  e2e:
    name: build · playwright
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright's Chromium (keyed by the lockfile, so a Playwright bump refreshes it)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-rules:
    name: deploy firebase rules
    needs: [checks, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job-level values override the placeholders above. Secrets are never echoed.
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff below needs the push's base commit
      - name: Did this push change the rules?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          paths="rules firestore.indexes.json scripts/build-rules.mjs scripts/rules-stamp.mjs scripts/lib/rules-version.mjs"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit (first push or force-push): deploying."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- $paths; then
            echo "Rules unchanged in this push: nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rules changed:"; git diff --name-only "$BEFORE" "$AFTER" -- $paths
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the secrets and the variable are set
        if: steps.changed.outputs.changed == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (base64 of the service-account JSON) in Settings → Secrets and variables → Actions."; exit 1; }
          [ -n "$ALLOWED_EMAILS" ] || { echo "::error::Add the ALLOWED_EMAILS secret (the two emails, comma-separated)."; exit 1; }
          [ -n "$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" ] || { echo "::error::Add the CLOUDINARY_CLOUD_NAME repository variable (the Firestore rules validate media URLs by cloud name; the CI placeholder must never be deployed)."; exit 1; }
      - if: steps.changed.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - if: steps.changed.outputs.changed == 'true'
        run: npm install -g firebase-tools
      - name: Service account → temp file (GOOGLE_APPLICATION_CREDENTIALS)
        if: steps.changed.outputs.changed == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" | base64 -d > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).project_id)' "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"
      - name: Build the rules (real emails, cloud name and project id; RULES_VERSION from the templates)
        if: steps.changed.outputs.changed == 'true'
        run: NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" node scripts/build-rules.mjs
      - name: Deploy Firestore rules + indexes and RTDB rules
        if: steps.changed.outputs.changed == 'true'
        run: firebase deploy --only firestore:rules,firestore:indexes,database --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Stamp meta/rulesVersion
        if: steps.changed.outputs.changed == 'true'
        run: node scripts/rules-stamp.mjs
